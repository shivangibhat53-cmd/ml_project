version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Upgrading pip..."
      - pip install --upgrade pip
  build:
    commands:
      - echo "Testing package installation compatibility..."
      - pip install -r requirements.txt
artifacts:
  files:
    - '**/*'
  exclude-paths:
    - 'wheelhouse/**/*'
    - '.git/**/*'