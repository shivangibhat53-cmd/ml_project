version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
    commands:
      - echo "Upgrading pip..."
      - pip install --upgrade pip
  build:
    commands:
      - echo "Downloading pre-compiled wheels for Elastic Beanstalk..."
      # This downloads everything as a ready-to-install binary file (.whl)
      - pip wheel -r prod_requirements.txt --wheel-dir=wheelhouse
artifacts:
  files:
    - '**/*'